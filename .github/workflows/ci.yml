name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per workflow per ref. A push that supersedes a still-running run cancels it
# instead of paying for both: measured over 30 days on cogno-host, 1526 of 3016 billed CI minutes
# (51%) went to runs a newer push had already made obsolete.
#
# The key is WORKFLOW + ref, not ref alone. A ref-only group would put this workflow and the
# publish workflow beside it into the SAME group on a push to main, so a release could cancel CI,
# or CI a release. A group is a lane; two workflows that mean different things do not share one.
#
# `main` is EXEMPT from cancellation, deliberately. A push to main is a commit nobody will
# re-push, so cancelling its run leaves that commit with no verdict at all — and main is the ref
# a release tag is cut from. On main the group still SERIALISES (a second run queues behind the
# first) rather than cancelling: the waste this exists to stop is iterating on a PR, not merging,
# and merges are already serialised by review. On a pull_request event github.ref is
# refs/pull/<n>/merge, never refs/heads/main, so PR runs always cancel — which is where the 51%
# is. The cost of the exemption is therefore close to zero and it buys back a per-commit verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # cogno-synapse is a type-only dep of the lib, but the integration tests
          # exercise the real OllamaEmbedder path, so install it (+ its own dep
          # cogno-homeo) from git — neither is on PyPI yet. Without it the
          # integration module importorskips to zero collected tests and pytest
          # exits 5 ("no tests collected"), failing the step.
          pip install "cogno-homeo @ git+https://github.com/sudoers-ai/cogno-homeo.git"
          pip install "cogno-synapse @ git+https://github.com/sudoers-ai/cogno-synapse.git"
      - name: Lint (ruff)
        run: ruff check cogno_persona cognobench tests examples
      - name: Type-check (mypy)
        run: mypy cogno_persona
      - name: Unit tests
        run: pytest tests/unit -q --cov=cogno_persona --cov-report=term-missing --cov-fail-under=90
      - name: Routing bench smoke (deterministic, no network)
        run: python cognobench.py --stub --min-score 100
      - name: Integration tests (auto-skip without Ollama / cogno-synapse)
        # These need a live Ollama (absent in CI), so they skip. When the whole
        # module skips at importorskip, pytest collects zero tests and exits 5
        # ("no tests collected") — tolerate that; fail on any other non-zero.
        run: pytest tests/integration -q || [ $? -eq 5 ]
